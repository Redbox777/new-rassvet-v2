site_name: "New Dawn v2.0"
site_description: "Open source civilization rebuilding knowledge base"
site_author: "New Dawn Team"

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: deep orange
      accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition

nav:
  - Home: index.md
  - Core:
    - "00_Core/README.md"
    - "Code": "00_Core/01_Code.md"
    - "Principles": "00_Core/02_Principles.md"
    - "TRL Levels": "00_Core/03_TRL.md"
  - Energy:
    - "03_Energy/README.md"
    - "Gravity Storage": "03_Energy/01_Gravity.md"
    - "Solar Panels": "03_Energy/02_Solar.md"
    - "Thorium Reactors": "03_Energy/03_Thorium.md"
  - Food & Water:
    - "06_Food/README.md"
    - "Fertilizers": "06_Food/01_Fertilizers.md"
    - "Garden Beds": "06_Food/02_Beds.md"
    - "Nutrition": "06_Food/03_Nutrition.md"
  - Materials:
    - "07_Materials/README.md"
    - "Basic Materials": "07_Materials/01_Materials.md"
    - "Tools": "07_Materials/02_Tools.md"
    - "Workshop": "07_Materials/03_Workshop.md"
  - CAD Models: cad_models/README.md
  - License: LICENSE.md
