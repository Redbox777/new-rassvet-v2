<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="700" xmlns="http://www.w3.org/2000/svg">
  <text x="200" y="25" font-size="18" text-anchor="middle" font-family="Arial">Ветрогенератор</text>
  <text x="200" y="45" font-size="12" text-anchor="middle" font-family="Arial">NR-ENR-003 v1.0 | Ø1.2м, H6м</text>
  
  <!-- Лопасти -->
  <ellipse cx="200" cy="100" rx="80" ry="80" fill="none" stroke="#87CEEB" stroke-width="2"/>
  <path d="M 200,100 L 200,30 L 220,40 L 200,100" fill="#4682B4" stroke="#000" stroke-width="1"/>
  <path d="M 200,100 L 135,140 L 140,160 L 200,100" fill="#4682B4" stroke="#000" stroke-width="1"/>
  <path d="M 200,100 L 265,140 L 260,160 L 200,100" fill="#4682B4" stroke="#000" stroke-width="1"/>
  
  <!-- Генератор -->
  <rect x="170" y="160" width="60" height="40" fill="#696969" stroke="#000" stroke-width="2"/>
  <text x="200" y="185" font-size="8" text-anchor="middle" font-family="Arial" fill="#fff">12В</text>
  
  <!-- Мачта -->
  <rect x="190" y="200" width="20" height="450" fill="#4a4a4a" stroke="#000" stroke-width="2"/>
  
  <!-- Оттяжки -->
  <line x1="200" y1="300" x2="50" y2="650" stroke="#8B4513" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="200" y1="300" x2="350" y2="650" stroke="#8B4513" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Фундамент -->
  <rect x="150" y="650" width="100" height="30" fill="#696969" stroke="#000" stroke-width="2"/>
  
  <!-- Размеры -->
  <line x1="280" y1="100" x2="280" y2="200" stroke="red" stroke-width="1"/>
  <line x1="275" y1="100" x2="285" y2="100" stroke="red" stroke-width="1"/>
  <line x1="275" y1="200" x2="285" y2="200" stroke="red" stroke-width="1"/>
  <text x="300" y="150" font-size="10" font-family="Arial" fill="red">Ø1200мм</text>
  
  <line x1="100" y1="200" x2="100" y2="650" stroke="red" stroke-width="1"/>
  <line x1="95" y1="200" x2="105" y2="200" stroke="red" stroke-width="1"/>
  <line x1="95" y1="650" x2="105" y2="650" stroke="red" stroke-width="1"/>
  <text x="50" y="430" font-size="10" font-family="Arial" fill="red" transform="rotate(-90 50 430)">6000мм</text>
  
  <!-- Подписи -->
  <text x="200" y="695" font-size="10" text-anchor="middle" font-family="Arial">Мачта с оттяжками</text>
</svg>
