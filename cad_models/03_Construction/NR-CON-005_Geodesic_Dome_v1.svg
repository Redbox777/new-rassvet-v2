<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="25" font-size="18" text-anchor="middle" font-family="Arial">Геодезический купол 2V</text>
  <text x="300" y="45" font-size="12" text-anchor="middle" font-family="Arial">NR-CON-005 v1.0 | Ø6м, H3м</text>
  
  <!-- Вид сбоку (разрез) -->
  <path d="M 100,400 L 150,300 L 200,350 L 250,250 L 300,300 L 350,200 L 400,250 L 450,150 L 500,200 L 550,100 L 500,200 L 450,150 L 400,250 L 350,200 L 300,300 L 250,250 L 200,350 L 150,300 L 100,400" 
        fill="none" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Основание -->
  <line x1="100" y1="400" x2="550" y2="400" stroke="#654321" stroke-width="3"/>
  
  <!-- Вертикальная линия высоты -->
  <line x1="325" y1="100" x2="325" y2="400" stroke="red" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="340" y="250" font-size="10" font-family="Arial" fill="red">3000 мм</text>
  
  <!-- Горизонтальная линия диаметра -->
  <line x1="100" y1="420" x2="550" y2="420" stroke="red" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="325" y="440" font-size="10" text-anchor="middle" font-family="Arial" fill="red">6000 мм</text>
  
  <!-- Легенда -->
  <text x="100" y="470" font-size="10" font-family="Arial">Тип A: 1680мм (30 шт)</text>
  <text x="300" y="470" font-size="10" font-family="Arial">Тип B: 1480мм (5 шт)</text>
</svg>
