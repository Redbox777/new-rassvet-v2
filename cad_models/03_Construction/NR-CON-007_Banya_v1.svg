<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
  <text x="250" y="30" font-size="18" text-anchor="middle" font-family="Arial">Баня (План и разрез)</text>
  <text x="250" y="50" font-size="12" text-anchor="middle" font-family="Arial">NR-CON-007 v1.0</text>
  
  <!-- План помещения -->
  <rect x="50" y="100" width="400" height="250" fill="#DEB887" stroke="#000" stroke-width="2"/>
  
  <!-- Перегородка -->
  <line x1="250" y1="100" x2="250" y2="350" stroke="#000" stroke-width="2"/>
  
  <!-- Парная -->
  <text x="150" y="130" font-size="14" text-anchor="middle" font-family="Arial" font-weight="bold">ПАРНАЯ</text>
  <!-- Полок -->
  <rect x="70" y="250" width="160" height="80" fill="#8B4513" stroke="#000" stroke-width="1"/>
  <text x="150" y="295" font-size="10" text-anchor="middle" font-family="Arial" fill="#fff">Полок</text>
  <!-- Печь -->
  <rect x="70" y="120" width="60" height="60" fill="#696969" stroke="#000" stroke-width="2"/>
  <text x="100" y="155" font-size="8" text-anchor="middle" font-family="Arial" fill="#fff">Печь</text>
  
  <!-- Предбанник -->
  <text x="350" y="130" font-size="14" text-anchor="middle" font-family="Arial" font-weight="bold">ПРЕДБАННИК</text>
  <!-- Дверь -->
  <rect x="380" y="280" width="40" height="70" fill="#A0522D" stroke="#000" stroke-width="1"/>
  <text x="400" y="320" font-size="8" text-anchor="middle" font-family="Arial">Вход</text>
  
  <!-- Вентиляция -->
  <circle cx="350" cy="120" r="10" fill="none" stroke="blue" stroke-width="2"/>
  <text x="380" y="125" font-size="8" font-family="Arial" fill="blue">Вытяжка</text>
  <circle cx="350" cy="330" r="10" fill="none" stroke="green" stroke-width="2"/>
  <text x="380" y="335" font-size="8" font-family="Arial" fill="green">Приток</text>
</svg>
