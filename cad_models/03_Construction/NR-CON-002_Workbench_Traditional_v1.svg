<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <text x="400" y="25" font-size="18" text-anchor="middle" font-family="Arial">Верстак - Вид спереди</text>
  <text x="400" y="45" font-size="12" text-anchor="middle" font-family="Arial">NR-CON-002 v1.0 | 1800×600×850мм</text>
  
  <!-- Крышка -->
  <rect x="100" y="100" width="600" height="40" fill="#8B7355" stroke="#000" stroke-width="2"/>
  
  <!-- Ножки -->
  <rect x="120" y="140" width="40" height="310" fill="#6B5345" stroke="#000" stroke-width="2"/>
  <rect x="640" y="140" width="40" height="310" fill="#6B5345" stroke="#000" stroke-width="2"/>
  
  <!-- Царги верхние -->
  <rect x="160" y="160" width="480" height="30" fill="#6B5345" stroke="#000" stroke-width="1"/>
  
  <!-- Нижняя полка -->
  <rect x="140" y="380" width="520" height="30" fill="#6B5345" stroke="#000" stroke-width="2"/>
  
  <!-- Тиски (схематично) -->
  <rect x="80" y="120" width="40" height="60" fill="#4a4a4a" stroke="#000" stroke-width="1"/>
  <text x="100" y="155" font-size="10" text-anchor="middle" font-family="Arial">Тиски</text>
  
  <!-- Размеры -->
  <line x1="100" y1="450" x2="700" y2="450" stroke="#000" stroke-width="1"/>
  <line x1="100" y1="445" x2="100" y2="455" stroke="#000" stroke-width="1"/>
  <line x1="700" y1="445" x2="700" y2="455" stroke="#000" stroke-width="1"/>
  <text x="400" y="470" font-size="12" text-anchor="middle" font-family="Arial">1800 мм</text>
  
  <line x1="50" y1="100" x2="50" y2="450" stroke="#000" stroke-width="1"/>
  <line x1="45" y1="100" x2="55" y2="100" stroke="#000" stroke-width="1"/>
  <line x1="45" y1="450" x2="55" y2="450" stroke="#000" stroke-width="1"/>
  <text x="25" y="280" font-size="12" text-anchor="middle" font-family="Arial" transform="rotate(-90 25 280)">850 мм</text>
</svg>
