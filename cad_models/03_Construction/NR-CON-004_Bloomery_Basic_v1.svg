<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="700" xmlns="http://www.w3.org/2000/svg">
  <text x="300" y="25" font-size="18" text-anchor="middle" font-family="Arial">Сыродутный горн - Разрез</text>
  <text x="300" y="45" font-size="12" text-anchor="middle" font-family="Arial">NR-CON-004 v1.0 | Ø300мм, H800мм</text>
  
  <!-- Фундамент -->
  <rect x="200" y="600" width="200" height="80" fill="#696969" stroke="#000" stroke-width="2"/>
  
  <!-- Шахта горна -->
  <rect x="220" y="200" width="160" height="400" fill="#8B4513" stroke="#000" stroke-width="2"/>
  <rect x="240" y="220" width="120" height="380" fill="#2F1810" stroke="none"/>
  
  <!-- Фурма (труба) -->
  <rect x="150" y="480" width="110" height="20" fill="#4a4a4a" stroke="#000" stroke-width="1"/>
  
  <!-- Уголь внутри -->
  <rect x="245" y="300" width="110" height="200" fill="#1a1a1a" stroke="none"/>
  
  <!-- Огонь (схематично) -->
  <polygon points="280,450 300,400 320,450" fill="#ff6600" stroke="#ff4500" stroke-width="1"/>
  <polygon points="290,430 310,380 330,430" fill="#ff8800" stroke="none"/>
  
  <!-- Мехи (схематично слева) -->
  <rect x="50" y="550" width="100" height="80" fill="#8B7355" stroke="#000" stroke-width="1"/>
  <line x1="150" y1="490" x2="150" y2="590" stroke="#4a4a4a" stroke-width="3"/>
  
  <!-- Размеры -->
  <line x1="420" y1="200" x2="420" y2="600" stroke="#000" stroke-width="1"/>
  <line x1="415" y1="200" x2="425" y2="200" stroke="#000" stroke-width="1"/>
  <line x1="415" y1="600" x2="425" y2="600" stroke="#000" stroke-width="1"/>
  <text x="450" y="410" font-size="12" font-family="Arial">800 мм</text>
  
  <line x1="220" y1="650" x2="380" y2="650" stroke="#000" stroke-width="1"/>
  <line x1="220" y1="645" x2="220" y2="655" stroke="#000" stroke-width="1"/>
  <line x1="380" y1="645" x2="380" y2="655" stroke="#000" stroke-width="1"/>
  <text x="300" y="675" font-size="12" text-anchor="middle" font-family="Arial">Ø300 мм</text>
  
  <!-- Подписи -->
  <text x="260" y="320" font-size="10" fill="#fff" font-family="Arial">Уголь + руда</text>
  <text x="160" y="485" font-size="10" font-family="Arial">Фурма</text>
  <text x="240" y="620" font-size="10" font-family="Arial">Фундамент</text>
  <text x="60" y="600" font-size="10" font-family="Arial">Мехи</text>
</svg>
