<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
  <text x="250" y="30" font-size="18" text-anchor="middle" font-family="Arial">Русская печь (Схема)</text>
  <text x="250" y="50" font-size="12" text-anchor="middle" font-family="Arial">NR-CON-006 v1.0</text>
  
  <!-- Фундамент -->
  <rect x="50" y="320" width="400" height="50" fill="#696969" stroke="#000" stroke-width="2"/>
  
  <!-- Основание (опечье) -->
  <rect x="70" y="250" width="360" height="70" fill="#8B4513" stroke="#000" stroke-width="2"/>
  <text x="250" y="290" font-size="10" text-anchor="middle" font-family="Arial">Ниша для дров</text>
  
  <!-- Шесток и устье -->
  <rect x="70" y="180" width="200" height="70" fill="#A0522D" stroke="#000" stroke-width="2"/>
  <path d="M 270,180 L 270,250 L 350,250 L 350,180 Z" fill="#333" stroke="#000" stroke-width="2"/>
  <text x="310" y="220" font-size="10" text-anchor="middle" font-family="Arial" fill="#fff">Устье</text>
  <text x="170" y="220" font-size="10" text-anchor="middle" font-family="Arial">Шесток</text>
  
  <!-- Свод и лежанка -->
  <path d="M 70,180 Q 250,80 430,180" fill="#CD853F" stroke="#000" stroke-width="2"/>
  <rect x="70" y="100" width="360" height="80" fill="#DEB887" stroke="#000" stroke-width="2"/>
  <text x="250" y="150" font-size="12" text-anchor="middle" font-family="Arial">Лежанка</text>
  
  <!-- Труба -->
  <rect x="350" y="20" width="60" height="160" fill="#696969" stroke="#000" stroke-width="2"/>
  <text x="380" y="100" font-size="10" text-anchor="middle" font-family="Arial" fill="#fff">Труба</text>
</svg>
