<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Заголовок -->
  <text x="400" y="30" font-size="20" text-anchor="middle" font-family="Arial">Компостер Джонсона - Вид спереди</text>
  <text x="400" y="50" font-size="14" text-anchor="middle" font-family="Arial">NR-AGR-001 v1.0 | Масштаб 1:10</text>
  
  <!-- Основной контур -->
  <rect x="100" y="100" width="600" height="400" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Вертикальные перегородки (3 секции) -->
  <line x1="300" y1="100" x2="300" y2="500" stroke="black" stroke-width="2"/>
  <line x1="500" y1="100" x2="500" y2="500" stroke="black" stroke-width="2"/>
  
  <!-- Горизонтальные линии передних панелей -->
  <line x1="100" y1="233" x2="300" y2="233" stroke="blue" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="100" y1="366" x2="300" y2="366" stroke="blue" stroke-width="1" stroke-dasharray="5,5"/>
  
  <line x1="300" y1="233" x2="500" y2="233" stroke="blue" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="300" y1="366" x2="500" y2="366" stroke="blue" stroke-width="1" stroke-dasharray="5,5"/>
  
  <line x1="500" y1="233" x2="700" y2="233" stroke="blue" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="500" y1="366" x2="700" y2="366" stroke="blue" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Вентиляционные отверстия (кружки) -->
  <circle cx="150" cy="150" r="8" fill="none" stroke="red" stroke-width="1"/>
  <circle cx="250" cy="150" r="8" fill="none" stroke="red" stroke-width="1"/>
  <circle cx="150" cy="300" r="8" fill="none" stroke="red" stroke-width="1"/>
  <circle cx="250" cy="300" r="8" fill="none" stroke="red" stroke-width="1"/>
  
  <circle cx="350" cy="150" r="8" fill="none" stroke="red" stroke-width="1"/>
  <circle cx="450" cy="150" r="8" fill="none" stroke="red" stroke-width="1"/>
  <circle cx="350" cy="300" r="8" fill="none" stroke="red" stroke-width="1"/>
  <circle cx="450" cy="300" r="8" fill="none" stroke="red" stroke-width="1"/>
  
  <circle cx="550" cy="150" r="8" fill="none" stroke="red" stroke-width="1"/>
  <circle cx="650" cy="150" r="8" fill="none" stroke="red" stroke-width="1"/>
  <circle cx="550" cy="300" r="8" fill="none" stroke="red" stroke-width="1"/>
  <circle cx="650" cy="300" r="8" fill="none" stroke="red" stroke-width="1"/>
  
  <!-- Размеры -->
  <text x="200" y="540" font-size="12" text-anchor="middle" font-family="Arial">1000 мм</text>
  <text x="400" y="540" font-size="12" text-anchor="middle" font-family="Arial">1000 мм</text>
  <text x="600" y="540" font-size="12" text-anchor="middle" font-family="Arial">1000 мм</text>
  
  <text x="50" y="300" font-size="12" text-anchor="middle" font-family="Arial" transform="rotate(-90 50 300)">1200 мм</text>
  
  <!-- Легенда -->
  <text x="100" y="580" font-size="10" font-family="Arial">Чёрный - каркас</text>
  <text x="300" y="580" font-size="10" font-family="Arial">Синий - передние панели</text>
  <text x="500" y="580" font-size="10" font-family="Arial">Красный - вентиляция</text>
</svg>
