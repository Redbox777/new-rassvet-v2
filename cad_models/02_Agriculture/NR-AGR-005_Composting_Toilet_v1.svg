<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <text x="200" y="30" font-size="18" text-anchor="middle" font-family="Arial">Компостный туалет (Разрез)</text>
  <text x="200" y="50" font-size="12" text-anchor="middle" font-family="Arial">NR-AGR-005 v1.0</text>
  
  <!-- Короб -->
  <rect x="100" y="150" width="200" height="300" fill="#8B4513" stroke="#000" stroke-width="2"/>
  
  <!-- Сиденье -->
  <rect x="120" y="140" width="160" height="20" fill="#A0522D" stroke="#000" stroke-width="2"/>
  <ellipse cx="200" cy="140" rx="40" ry="10" fill="#333" stroke="#000" stroke-width="1"/>
  
  <!-- Ведро внутри -->
  <rect x="130" y="160" width="140" height="200" fill="#696969" stroke="#000" stroke-width="2"/>
  <text x="200" y="270" font-size="10" text-anchor="middle" font-family="Arial" fill="#fff">Отходы + Торф/Зола</text>
  
  <!-- Вентиляционная труба -->
  <rect x="260" y="180" width="20" height="270" fill="#4a4a4a" stroke="#000" stroke-width="1"/>
  <text x="300" y="300" font-size="10" font-family="Arial">Вентиляция</text>
  
  <!-- Стрелка воздуха -->
  <path d="M 270,450 L 270,180" stroke="blue" stroke-width="2" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="blue" />
    </marker>
  </defs>
</svg>
